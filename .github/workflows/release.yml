name: Release

# develop から main へのマージ（= main への push）で、dmg をビルドして GitHub Release に載せる
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app and dmg
        run: ./build_app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video2MD-dmg
          path: dist/Video2MD.dmg

      - name: Decide tag
        id: tag
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" scripts/Info.plist)
          echo "name=v${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" dist/Video2MD.dmg \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
